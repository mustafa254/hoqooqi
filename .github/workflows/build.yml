name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
      
      # هذه الخطوة تنشئ بنية مشروع أندرويد وفلاتر كاملة تلقائياً إذا كانت ناقصة
      - name: Create Flutter template structure if missing
        run: |
          flutter create . --org com.hoqoqi.app --project-name hoqoqi --platforms=android --overwrite
          
      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
