name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          # إذا كان مشروع الفلاتر داخل مجلد رئيسي بالمستودع، اكتب اسمه هنا (مثلاً hoqoqi)، وإذا كان بالمجلد الجذر اتركه أو اضبط المسار
      - run: flutter pub get
        working-directory: .
      - run: flutter build apk --release
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
